<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blog Admin | Kraken</title><link rel="stylesheet" href="blog-admin.css"></head><body><header class="top"><a href="admin.html">K · Blog Builder</a><nav><a href="admin.html">Courses</a><a href="blog.html">Public blog</a></nav><button id="signOut">Sign out</button></header><main class="shell"><section class="hero"><small>Kraken V12.9</small><h1>Build medical articles</h1><p>Post text, pictures, videos and useful links.</p></section><div class="layout"><aside class="panel side"><button class="btn primary" id="newPost">+ New post</button><div id="postList"></div></aside><form id="form" class="panel"><input id="id" type="hidden"><div class="grid"><label class="field">Title<input id="title" required></label><label class="field">Slug<input id="slug"></label></div><label class="field">Short description<textarea id="excerpt" required></textarea></label><div class="grid"><label class="field">Category<input id="category" value="Kraken news"></label><label class="field">Author<input id="author" value="Kraken Medical Training"></label></div><div class="grid"><label class="field">Cover image URL<input id="cover" type="url"></label><label class="field">Reading time<input id="time" type="number" min="1" value="5"></label></div><div class="grid"><label class="field">Status<select id="status"><option value="draft">Draft</option><option value="published">Published</option></select></label><label class="field">Featured<input id="featured" type="checkbox"></label></div><h2>Content blocks</h2><div class="toolbar"><button type="button" data-add="heading">Heading</button><button type="button" data-add="paragraph">Paragraph</button><button type="button" data-add="image">Image</button><button type="button" data-add="video">Video</button><button type="button" data-add="link">Link</button><button type="button" data-add="quote">Quote</button><button type="button" data-add="list">List</button><button type="button" data-add="callout">Callout</button></div><div id="blocks"></div><div class="actions"><button class="btn primary" type="submit">Save post</button><button class="btn" id="delete" type="button">Delete</button></div></form></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="common.js"></script><script src="blog-admin.js"></script></body></html>
