<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collection Details | Kraken Medical Training</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="kraken-site-nav.css"><link rel="stylesheet" href="kraken-public.css"><link rel="stylesheet" href="collections-public.css"><style>body{background:#061611;color:#f4faf7;font-family:Inter,Arial,sans-serif}.kc-detail{max-width:900px;margin:auto;padding:70px 24px}.kc-detail h1{font-size:clamp(2.4rem,6vw,4rem)}.kc-detail p,.kc-detail li{line-height:1.7;color:#344e56!important}.kc-detail li{padding:10px}.kc-detail h1,.kc-detail h2{color:#102b35!important}.kc-detail .kc-kicker,.kc-detail .kc-back{color:#087d72!important}.kc-detail .kc-notice{border:1px solid #14564d;border-radius:14px;padding:18px;margin-top:30px;background:#0b2927}.kc-detail .kc-notice strong{color:#f7fbf9!important}.kc-detail .kc-notice p{color:#e0efea!important} .kc-buy{background:#10b5a6;color:#052d2b;border:0;border-radius:10px;padding:15px 24px;font-weight:800;cursor:pointer;font-size:1rem}.kc-buy:disabled{opacity:.6;cursor:wait}.kc-feedback{margin-top:14px;min-height:1.5em;color:#344e56!important}</style></head><body class="kraken-public-page"><div data-kraken-site-nav></div><main class="kc-detail"><a class="kc-back" href="collections.html">← All collections</a><div id="collectionDetail"><p>Loading collection…</p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="kraken-site-nav.js"></script><script>
(async()=>{const mount=document.getElementById("collectionDetail");const id=new URLSearchParams(location.search).get("id");const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));if(!/^[0-9a-f-]{36}$/i.test(id||"")){mount.textContent="Invalid collection link.";return;}try{const r=await supabaseClient.from("course_collections").select("id,title,description,price_pence,course_collection_items(course_id,position)").eq("id",id).eq("status","Published").maybeSingle();if(r.error)throw r.error;if(!r.data){mount.textContent="This collection is not available.";return;}const d=r.data;const ids=(d.course_collection_items||[]).map(x=>x.course_id);let titles=new Map();if(ids.length){const cr=await supabaseClient.from("courses").select("id,title").in("id",ids).eq("status","Published");if(!cr.error)titles=new Map((cr.data||[]).map(x=>[x.id,x.title]));}const list=(d.course_collection_items||[]).sort((a,b)=>a.position-b.position).map(x=>'<li>'+esc(titles.get(x.course_id)||"Included course")+'</li>').join("");mount.innerHTML='<span class="kc-kicker">TRAINING COLLECTION</span><h1>'+esc(d.title)+'</h1><p>'+esc(d.description)+'</p><h2>Included courses</h2><ul>'+list+'</ul><h2>£'+(d.price_pence/100).toFixed(2)+'</h2><button class="kc-buy" id="buyCollection" type="button">Buy collection · £'+(d.price_pence/100).toFixed(2)+'</button><p id="checkoutFeedback" class="kc-feedback" role="status" aria-live="polite"></p>';const buy=document.getElementById("buyCollection");const feedback=document.getElementById("checkoutFeedback");const checkoutStatus=new URLSearchParams(location.search).get("checkout");if(checkoutStatus==="success")feedback.textContent="Payment submitted. Your courses will unlock once Stripe confirms payment.";if(checkoutStatus==="cancelled")feedback.textContent="Checkout cancelled.";buy.addEventListener("click",async()=>{buy.disabled=true;feedback.textContent="Preparing secure checkout…";try{const {data:{session},error:authError}=await supabaseClient.auth.getSession();if(authError||!session?.access_token){feedback.textContent="Please sign in before purchasing this collection.";buy.disabled=false;return;}const response=await fetch("https://kraken-payments.krakenmedicaltraining.workers.dev/api/create-collection-checkout-session",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token},body:JSON.stringify({collection_id:d.id})});const payload=await response.json().catch(()=>({}));if(!response.ok)throw Error(payload.error||"Checkout could not start");if(!/^https:\/\/checkout\.stripe\.com\//.test(payload.checkout_url||""))throw Error("Invalid checkout destination");window.location.assign(payload.checkout_url);}catch(e){console.error("Collection checkout:",e);feedback.textContent=e.message||"Checkout unavailable. Please try again.";buy.disabled=false;}});;}catch(e){console.error(e);mount.textContent="Unable to load this collection right now.";}})();
</script></body></html>
