<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kraken Journal</title>
  <link rel="stylesheet" href="journal.css">
</head>
<body>
<header class="j-topbar">
  <a class="j-brand" href="index.html"><span>K</span><strong>Kraken Journal</strong></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="courses.html">Courses</a>
    <a href="library.html">Library</a>
    <a href="journal.html" class="active">Journal</a>
  </nav>
</header>

<main>
  <section class="j-hero">
    <div class="j-hero-inner">
      <span class="j-eyebrow">Medical learning, updates and field notes</span>
      <h1>Kraken Journal</h1>
      <p>Articles, videos, podcasts, downloads, events and clinical case studies in one content hub.</p>
    </div>
  </section>

  <div class="j-shell">
    <section id="featuredSection" hidden>
      <article id="featuredItem" class="featured-item"></article>
    </section>

    <section class="j-controls">
      <input id="journalSearch" type="search" placeholder="Search the Journal">
      <select id="journalType">
        <option value="">All content types</option>
        <option value="article">Articles</option>
        <option value="video">Videos</option>
        <option value="podcast">Podcasts</option>
        <option value="download">Downloads</option>
        <option value="news">News</option>
        <option value="event">Events</option>
        <option value="case_study">Case studies</option>
      </select>
      <select id="journalCategory"><option value="">All categories</option></select>
    </section>

    <section>
      <div class="j-section-head">
        <div><span class="j-eyebrow">Latest content</span><h2>Explore the Journal</h2></div>
      </div>
      <div id="journalGrid" class="journal-grid"><div class="j-empty">Loading the Journal…</div></div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="journal.js"></script>
</body>
</html>
