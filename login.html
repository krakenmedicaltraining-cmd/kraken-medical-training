<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in | Kraken Medical Training</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">K</span><span>Kraken Medical Training</span></a><a class="button button-small button-ghost" href="index.html">Back home</a></header>
<main><section class="page-hero"><span class="eyebrow">Prototype account</span><h1>Save your learning</h1><p>This demonstration stores only a display name in your browser. Real secure accounts will be added later with Supabase.</p></section>
<form class="form-card" id="loginForm"><div class="field"><label for="displayName">Display name</label><input id="displayName" required maxlength="40" placeholder="e.g. Connall"></div><div class="field"><label for="email">Email</label><input id="email" type="email" required placeholder="name@example.com"></div><button class="button button-full" type="submit">Continue to dashboard</button><p class="form-note">Demo only. No details are sent anywhere or stored on a server.</p></form></main>
<script src="common.js"></script><script>$("#loginForm").addEventListener("submit",e=>{e.preventDefault();localStorage.setItem("kmtUser",JSON.stringify({name:$("#displayName").value.trim(),email:$("#email").value.trim()}));const next=localStorage.getItem("kmtReturnTo")||"dashboard.html";localStorage.removeItem("kmtReturnTo");location.href=next;});</script></body></html>
