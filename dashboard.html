<script src="common.js"></script><script>if(!isLoggedIn()) location.replace("login.html");const user=JSON.parse(localStorage.getItem("kmtUser")||"{}");$("#welcomeTitle").textContent=`Welcome, ${user.name||"learner"}`;const p=getProgress();const count=Object.values(p.marchPaws||{}).filter(Boolean).length;$("#completedCount").textContent=count;$("#progressPercent").textContent=`${Math.round(count/6*100)}%`;$("#logoutButton").addEventListener("click",()=>{localStorage.removeItem("kmtUser");location.href="index.html";});</script></body></html>
