<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>In-Person Course Builder</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="kraken-v12-pages.css"><link rel="stylesheet" href="in-person-training.css"></head><body class="k12-shell"><main class="k16-wrap k16-section"><span class="k16-eyebrow">Admin Hub</span><h1 class="k16-title">In-Person Course Builder</h1><p>Create and publish instructor-led courses without touching GitHub.</p>
<form id="trainingForm" class="k16-form"><input type="hidden" id="editingId"><label>Course title<input id="title" required></label><label>Short description<textarea id="short_description" required></textarea></label><div class="k16-two"><label>Category<input id="category" placeholder="Basic Life Support"></label><label>Status<select id="status"><option>Draft</option><option>Published</option></select></label></div><div class="k16-two"><label>Duration<input id="duration" placeholder="3 hours"></label><label>Maximum learners<input id="max_learners" type="number" min="1"></label></div><div class="k16-two"><label>Price from (£)<input id="price_from" type="number" min="0" step=".01"></label><label>Price suffix<input id="price_suffix" placeholder="+ VAT / per course"></label></div><label>Location / coverage<input id="location_text" placeholder="Scotland / UK-wide / At your venue"></label><label>Thumbnail URL<input id="thumbnail_url" type="url"></label><label>Hero image URL<input id="hero_image_url" type="url"></label><label>Course overview<textarea id="overview" rows="6"></textarea></label><label>Who is it for?<textarea id="audience" rows="3"></textarea></label><label>Learning outcomes, one per line<textarea id="outcomes" rows="6"></textarea></label><label>What the client provides, one per line<textarea id="client_provides" rows="5"></textarea></label><label>What Kraken brings, one per line<textarea id="provider_provides" rows="5"></textarea></label><label>FAQs (one per line using Question | Answer)<textarea id="faqs" rows="7"></textarea></label><label style="display:flex;gap:10px;align-items:center"><input id="featured" type="checkbox" style="width:auto"> Featured course</label><button class="k16-btn" type="submit">Save course</button><p id="saveState"></p></form>
<section class="k16-section"><h2>Existing courses</h2><div id="adminTrainingList" class="k16-grid"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="common.js"></script><script src="in-person-admin.js"></script></body></html>
