<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CPD Reflection Builder | Kraken Medical Training</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">K</span><span>Kraken Medical Training</span></a><a class="button button-small button-ghost" href="index.html#training">Back to training</a></header>
<main><section class="page-hero"><span class="eyebrow">Interactive tool</span><h1>CPD Reflection Builder</h1><p>Use fictional or properly anonymised information only. The completed reflection stays in your browser unless you copy it.</p></section>
<form class="form-card" id="cpdForm"><div class="field"><label for="experience">What happened?</label><textarea id="experience" rows="4" required></textarea></div><div class="field"><label for="learning">What did you learn?</label><textarea id="learning" rows="4" required></textarea></div><div class="field"><label for="action">What will you do differently?</label><textarea id="action" rows="4" required></textarea></div><button class="button button-full" type="submit">Build reflection</button></form>
<section class="section" id="resultSection" hidden><div class="content-panel"><span class="eyebrow">Your draft</span><h2>Structured reflection</h2><div id="reflectionResult"></div><div class="hero-actions"><button class="button" id="copyReflection">Copy reflection</button><button class="button button-ghost" id="clearReflection">Clear</button></div></div></section></main>
<script src="common.js"></script><script>
let output="";$("#cpdForm").addEventListener("submit",e=>{e.preventDefault();output=`Description\n${$("#experience").value.trim()}\n\nLearning\n${$("#learning").value.trim()}\n\nAction plan\n${$("#action").value.trim()}`;$("#reflectionResult").innerHTML=`<h3>Description</h3><p>${escapeHtml($("#experience").value)}</p><h3>Learning</h3><p>${escapeHtml($("#learning").value)}</p><h3>Action plan</h3><p>${escapeHtml($("#action").value)}</p>`;$("#resultSection").hidden=false;$("#resultSection").scrollIntoView({behavior:"smooth"});});
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
$("#copyReflection").addEventListener("click",async()=>{await navigator.clipboard.writeText(output);showToast("Reflection copied");});
$("#clearReflection").addEventListener("click",()=>{$("#cpdForm").reset();$("#resultSection").hidden=true;output="";});
</script></body></html>
