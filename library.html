<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kraken Library | Medical Resources</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="kraken-v12-pages.css">
</head>
<body class="k12-shell">
<header class="k12-topbar">
  <a class="k12-back" href="index.html" aria-label="Home">←</a>
  <a class="k12-brand" href="index.html"><span class="k12-mark">K</span><span>Kraken Library</span></a>
  <a class="k12-action primary" href="dashboard.html">Dashboard</a>
</header>
<main class="k12-main">
  <section class="k12-hero">
    <div class="k12-hero-inner">
      <span class="k12-eyebrow">Books, downloads and teaching tools</span>
      <h1>Kraken Library</h1>
      <p>Find crib cards, PDFs, PowerPoints, lesson plans and practical learning resources without rummaging through digital cupboards.</p>
    </div>
  </section>
  <div class="k12-content">
    <section class="k12-section">
      <div class="k12-section-head"><div><span class="k12-eyebrow">Resource finder</span><h2>Search the library</h2></div></div>
      <div class="k12-card k12-controls">
        <div class="k12-field"><label for="librarySearch">Search</label><input id="librarySearch" placeholder="Search ECG, MARCH, CPD…"></div>
        <div class="k12-field"><label for="libraryCategory">Category</label><select id="libraryCategory"><option value="">All categories</option></select></div>
        <div class="k12-field"><label for="libraryType">File type</label><select id="libraryType"><option value="">All file types</option></select></div>
      </div>
      <div class="course-grid" id="libraryGrid"><div class="k12-empty">Loading the library…</div></div>
    </section>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script><script src="data.js"></script><script src="common.js"></script><script src="library.js"></script>
</body></html>
