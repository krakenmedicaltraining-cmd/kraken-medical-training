<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071b24">
  <title>Course Certificate | Kraken Medical Training</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="certificate.css">
</head>
<body>
  <header class="certificate-topbar">
    <a href="dashboard.html">← My Mission</a>

    <a class="certificate-topbar-brand" href="index.html">
      <img src="assets/kraken-medical-logo.png" alt="Kraken Medical Training">
      <span>
        <strong>KRAKEN</strong>
        <small>MEDICAL TRAINING</small>
      </span>
    </a>

    <button id="printCertificate" type="button">
      Print / Save PDF
    </button>
  </header>

  <main class="certificate-shell">
    <section id="certificateStatus" class="certificate-status">
      Loading your certificate…
    </section>

    <article id="certificateCard" class="certificate-card" hidden>
      <div class="certificate-inner">
        <div class="certificate-corner certificate-corner-a"></div>
        <div class="certificate-corner certificate-corner-b"></div>

        <div class="certificate-logo">
          <img src="assets/kraken-medical-logo.png" alt="Kraken Medical Training logo">
        </div>

        <span class="certificate-eyebrow">Kraken Medical Training</span>

        <h1>Certificate<br>of Completion</h1>

        <p class="certificate-copy">This certifies that</p>

        <div id="learnerName" class="certificate-name">Learner Name</div>

        <p class="certificate-copy">has successfully completed</p>

        <h2 id="courseTitle">Course title</h2>

        <div class="certificate-meta">
          <span id="issuedDate"></span>
          <span id="finalScore"></span>
        </div>

        <div class="certificate-rule"></div>

        <div class="certificate-footer">
          <div class="certificate-signature">
            <strong>Kraken Medical Training</strong>
            <span>Medical Education Platform</span>
          </div>

          <code id="certificateCode"></code>
        </div>
      </div>
    </article>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="common.js"></script>
  <script src="certificate.js"></script>
</body>
</html>
