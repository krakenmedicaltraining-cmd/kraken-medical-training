<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Courses | Kraken Medical Training</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="kraken-v11.css">
  <link rel="stylesheet" href="courses.css">
</head>
<body class="k-v11 courses-body">
  <header class="catalogue-header">
    <a class="catalogue-back" href="index.html" aria-label="Back">←</a>
    <a class="catalogue-brand" href="index.html"><span>K</span><strong>Kraken Learn</strong></a>
    <a class="catalogue-account" id="accountLink" href="student-login.html">Sign in</a>
  </header>

  <main>
    <section class="catalogue-hero">
      <div>
        <p class="catalogue-kicker">Training catalogue</p>
        <h1>Courses</h1>
        <p>Browse focused medical learning, practical scenarios and downloadable field resources.</p>
      </div>
    </section>

    <section class="catalogue-tools" aria-label="Course filters">
      <label class="catalogue-search"><span>⌕</span><input id="courseSearch" type="search" placeholder="Search courses" autocomplete="off"></label>
      <select id="categoryFilter" aria-label="Filter by clinical area"><option value="">All clinical areas</option></select>
    </section>

    <section class="catalogue-content">
      <div class="catalogue-heading"><div><p class="catalogue-kicker">Available now</p><h2 id="catalogueTitle">All courses</h2></div><span id="courseCount">Loading…</span></div>
      <div id="courseGrid" class="course-grid" aria-live="polite"><div class="catalogue-loading">Loading courses…</div></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="data.js"></script>
  <script src="common.js"></script>
  <script src="courses.js"></script>
</body>
</html>
