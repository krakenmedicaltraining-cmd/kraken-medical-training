<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#06110e"
  >

  <meta
    name="description"
    content="Kraken Medical Training CPD course player"
  >

  <title>
    CPD Course | Kraken Medical Training
  </title>


  <!-- =====================================================
       FONTS
       ===================================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Oswald:wght@500;600;700&display=swap"
    rel="stylesheet"
  >


  <!-- =====================================================
       EXISTING KRAKEN STYLES
       ===================================================== -->

  <link
    rel="stylesheet"
    href="styles.css"
  >

  <link
    rel="stylesheet"
    href="kraken-v11.css"
  >

  <link
    rel="stylesheet"
    href="course-player.css"
  >

  <link
    rel="stylesheet"
    href="quiz-player.css"
  >


  <!-- =====================================================
       V16 GLOBAL PUBLIC NAVIGATION
       ===================================================== -->

  <link
    rel="stylesheet"
    href="kraken-site-nav.css"
  >

</head>


<body class="k-v11 course-player-body">


  <!-- =====================================================
       GLOBAL KRAKEN NAVIGATION
       ===================================================== -->

  <div data-kraken-site-nav></div>


  <!-- =====================================================
       COURSE PLAYER

       IMPORTANT:
       Keep #coursePlayer unchanged because the course engine
       builds the actual course interface inside this element.
       ===================================================== -->

  <main
    id="coursePlayer"
    class="course-player-shell"
    aria-live="polite"
  >

    <section class="player-loading">

      <span
        class="player-spinner"
        aria-hidden="true"
      ></span>

      <p class="player-loading-kicker">
        KRAKEN CPD
      </p>

      <h1>
        Preparing course
      </h1>

      <p>
        Opening the Kraken learning environment…
      </p>

    </section>

  </main>


  <!-- =====================================================
       SUPABASE
       ===================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="supabase-config.js"></script>


  <!-- =====================================================
       GLOBAL KRAKEN NAVIGATION

       Loaded after Supabase because the navigation dynamically
       retrieves CPD and in-person training categories.
       ===================================================== -->

  <script src="kraken-site-nav.js"></script>


  <!-- =====================================================
       EXISTING COURSE SYSTEM

       Do not change the order of these scripts.
       ===================================================== -->

  <script src="data.js"></script>

  <script src="common.js"></script>

  <script src="course-engine.js"></script>

  <script src="course-player.js"></script>

  <script src="quiz-player.js"></script>


</body>

</html>
