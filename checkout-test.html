<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stripe checkout test | Kraken Medical Training</title>
<style>body{font:16px system-ui,sans-serif;background:#071b24;color:#f4f8fa;max-width:600px;margin:7vh auto;padding:24px}button{background:#26b7a0;color:#061b1a;border:0;border-radius:8px;padding:14px 20px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}a{color:#7ee0d2}#status{margin-top:20px;white-space:pre-wrap}</style></head>
<body><h1>Stripe checkout test</h1><p>This development-only page starts a £14.99 <strong>test</strong> payment for Adult BLS &amp; AED. No course access is granted yet.</p>
<p>Sign in to your learner account before testing. Do not use this for customer sales.</p>
<button id="checkout" type="button">Open test checkout</button><p id="status" role="status" aria-live="polite"></p><a href="courses.html">Back to courses</a>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script>
"use strict";
const btn=document.querySelector("#checkout"), status=document.querySelector("#status");
btn.addEventListener("click",async()=>{
 btn.disabled=true;status.textContent="Checking login...";
 try {
  const {data,error}=await supabaseClient.auth.getSession();
  if(error)throw error;
  const token=data?.session?.access_token;
  if(!token){status.textContent="Sign in to your learner account first.";return;}
  status.textContent="Creating Stripe test checkout...";
  const response=await fetch("https://kraken-payments.krakenmedicaltraining.workers.dev/api/create-checkout-session",{
   method:"POST",headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"}
  });
  const result=await response.json();
  if(!response.ok)throw new Error(result.error||"Checkout unavailable");
  const destination=new URL(result.checkout_url);
  if(destination.protocol!=="https:"||!(destination.hostname==="checkout.stripe.com"||destination.hostname.endsWith(".checkout.stripe.com")))throw new Error("Unexpected checkout destination");
  window.location.assign(destination.href);
 }catch(e){status.textContent="Checkout test failed: "+e.message;}
 finally{btn.disabled=false;}
});
</script></body></html>
