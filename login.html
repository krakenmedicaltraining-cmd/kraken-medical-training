<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin login | Kraken Medical Training</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>

<main>
<section class="section narrow">
<div class="panel auth-card">
<span class="eyebrow">Secure administration</span><h1>Admin login</h1>
<p>Sign in with the administrator account created in Supabase.</p>
<form id="loginForm">
<div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
<button class="button button-full" id="loginButton" type="submit">Sign in</button>
<p class="feedback" id="loginFeedback" aria-live="polite"></p>
</form>
</div>
</section>
</main>
<footer class="footer"><div class="brand"><span class="brand-mark">K</span><span>Kraken Medical Training</span></div><p>© <span id="year"></span></p></footer>

</body></html>
